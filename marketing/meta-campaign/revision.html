<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="lienzo" content="2400x1180">
<title>Revisión · Propuestas Meta Ads · Solar Service Mx</title>
<link rel="stylesheet" href="fuentes/marca.css">
<style>
  :root { --w: 2400px; --h: 1180px; }
  body { background: var(--cal-2); color: var(--basalto); }
  .lienzo { padding: 72px 80px; }
  header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid var(--basalto); padding-bottom: 24px; }
  header h1 { font-family: var(--serif); font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.015em; }
  header p { font-family: var(--mono); font-size: 22px; color: var(--tinta-2); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px; margin-top: 48px; }
  figure img { display: block; width: 100%; aspect-ratio: 1; border: 1px solid rgb(22 21 15 / 0.25); }
  figcaption { margin-top: 26px; }
  .n { font-family: var(--mono); font-size: 20px; color: var(--tezontle); font-weight: 500; }
  h2 { margin-top: 8px; font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1.05; }
  dl { margin-top: 14px; display: grid; grid-template-columns: 9.5rem 1fr; row-gap: 6px; font-size: 21px; line-height: 1.4; }
  dt { font-family: var(--mono); color: var(--tinta-2); font-size: 18px; padding-top: 3px; }
</style>
</head>
<body>
<div class="lienzo">
  <header>
    <h1>Meta Ads · Tres propuestas</h1>
    <p>Solar Service Mx · Pieza cuadrada 1080 × 1080 · Revisión antes de producir adaptaciones</p>
  </header>
  <div class="grid">
    <figure>
      <img src="propuestas/01-recibo/cuadrado-1080x1080.png" alt="">
      <figcaption>
        <span class="n">01 · Editorial sobre Cal</span>
        <h2>El recibo de luz</h2>
        <dl><dt>Titular</dt><dd>Que más de tu dinero se quede en casa</dd><dt>Visual</dt><dd>Recibo en papel, valle y sol</dd><dt>Botón</dt><dd>Enviar mensaje · WhatsApp</dd></dl>
      </figcaption>
    </figure>
    <figure>
      <img src="propuestas/02-sistema/cuadrado-1080x1080.png" alt="">
      <figcaption>
        <span class="n">02 · Técnico sobre Valle</span>
        <h2>Tu propio sistema solar</h2>
        <dl><dt>Titular</dt><dd>Tu techo, conectado a la red de CFE</dd><dt>Visual</dt><dd>Alzado del sistema con flujos</dd><dt>Botón</dt><dd>Enviar mensaje · WhatsApp</dd></dl>
      </figcaption>
    </figure>
    <figure>
      <img src="propuestas/03-negocio/cuadrado-1080x1080.png" alt="">
      <figcaption>
        <span class="n">03 · Lámina sobre Basalto</span>
        <h2>Energía para tu negocio</h2>
        <dl><dt>Titular</dt><dd>El techo de tu negocio puede trabajar</dd><dt>Visual</dt><dd>Plano en planta de techo comercial</dd><dt>Botón</dt><dd>Enviar mensaje · WhatsApp</dd></dl>
      </figcaption>
    </figure>
  </div>
</div>
</body>
</html>
